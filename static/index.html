<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>游戏库管理</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="wrap topbar-inner">
      <h1 class="logo">🎮 游戏库</h1>
      <button class="btn primary" id="btnAdd">+ 添加游戏</button>
    </div>
  </header>

  <main class="wrap">
    <!-- 统计面板 -->
    <section class="stats" id="stats" aria-label="统计信息">
      <div class="stat-card">
        <span class="stat-num" id="statTotal">0</span>
        <span class="stat-label">游戏总数</span>
      </div>
      <div class="stat-card">
        <span class="stat-num" id="statPlaying">0</span>
        <span class="stat-label">在玩</span>
      </div>
      <div class="stat-card">
        <span class="stat-num" id="statFinished">0</span>
        <span class="stat-label">已通关</span>
      </div>
      <div class="stat-card">
        <span class="stat-num" id="statAvg">0</span>
        <span class="stat-label">平均评分</span>
      </div>
    </section>

    <!-- 筛选工具栏 -->
    <section class="toolbar">
      <input type="search" id="search" class="search" placeholder="搜索游戏名 / 开发商 / 描述..." />
      <select id="filterGenre" class="select"><option value="">全部分类</option></select>
      <select id="filterStatus" class="select">
        <option value="">全部状态</option>
        <option value="未玩">未玩</option>
        <option value="在玩">在玩</option>
        <option value="已通关">已通关</option>
      </select>
    </section>

    <!-- 游戏列表 -->
    <section id="grid" class="grid" aria-live="polite"></section>
    <p id="empty" class="empty hidden">没有匹配的游戏，点击右上角添加一个吧。</p>
  </main>

  <!-- 编辑/新增模态框 -->
  <div class="modal-mask hidden" id="modal">
    <div class="modal">
      <div class="modal-head">
        <h2 id="modalTitle">添加游戏</h2>
        <button class="icon-btn" id="modalClose" aria-label="关闭">✕</button>
      </div>
      <form id="gameForm" class="form">
        <input type="hidden" id="f_id" />
        <div class="row">
          <label class="field">
            <span>标题 <i>*</i></span>
            <input type="text" id="f_title" required maxlength="100" />
          </label>
          <label class="field">
            <span>分类 <i>*</i></span>
            <select id="f_genre" required></select>
          </label>
        </div>
        <div class="row">
          <label class="field">
            <span>平台</span>
            <select id="f_platform"></select>
          </label>
          <label class="field">
            <span>发行年份 <i>*</i></span>
            <input type="number" id="f_release_year" min="1950" max="2100" required />
          </label>
        </div>
        <div class="row">
          <label class="field">
            <span>开发商</span>
            <input type="text" id="f_developer" maxlength="80" />
          </label>
          <label class="field">
            <span>评分 (0-10) <i>*</i></span>
            <input type="number" id="f_rating" step="0.1" min="0" max="10" required />
          </label>
        </div>
        <div class="row">
          <label class="field">
            <span>游玩状态</span>
            <select id="f_play_status">
              <option value="未玩">未玩</option>
              <option value="在玩">在玩</option>
              <option value="已通关">已通关</option>
            </select>
          </label>
          <label class="field">
            <span>可玩游戏</span>
            <select id="f_game_type"></select>
          </label>
        </div>
        <label class="field">
          <span>封面图 URL</span>
          <input type="url" id="f_cover_url" placeholder="https://..." />
        </label>
        <label class="field">
          <span>简介</span>
          <textarea id="f_description" rows="3" maxlength="500"></textarea>
        </label>
        <div class="form-error" id="formError"></div>
        <div class="modal-actions">
          <button type="button" class="btn ghost" id="modalCancel">取消</button>
          <button type="submit" class="btn primary" id="modalSave">保存</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 删除确认 -->
  <div class="modal-mask hidden" id="confirmModal">
    <div class="modal small">
      <div class="modal-head">
        <h2>确认删除</h2>
      </div>
      <p class="confirm-text" id="confirmText">确定删除该游戏？</p>
      <div class="modal-actions">
        <button type="button" class="btn ghost" id="confirmCancel">取消</button>
        <button type="button" class="btn danger" id="confirmOk">删除</button>
      </div>
    </div>
  </div>

  <!-- 游戏详情 -->
  <div class="modal-mask hidden" id="detailModal">
    <div class="modal detail-modal">
      <button class="icon-btn detail-close" id="detailClose" aria-label="关闭">✕</button>
      <div class="detail-cover" id="detailCover"></div>
      <div class="detail-body">
        <div class="detail-head">
          <div>
            <span class="tag genre" id="detailGenre"></span>
            <h2 id="detailTitle"></h2>
          </div>
          <div class="detail-actions">
            <button type="button" class="btn primary" id="detailPlay">▶ 开始游戏</button>
            <button type="button" class="btn ghost" id="detailEdit">✏️ 编辑</button>
            <button type="button" class="btn danger" id="detailDel">🗑️ 删除</button>
          </div>
        </div>
        <div class="detail-meta" id="detailMeta"></div>
        <div class="detail-section">
          <h3>简介</h3>
          <p id="detailDesc" class="detail-desc"></p>
        </div>
        <div class="detail-section">
          <h3>详细信息</h3>
          <dl class="detail-info" id="detailInfo"></dl>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast 提示 -->
  <div class="toast hidden" id="toast"></div>

  <script src="/app.js"></script>
</body>
</html>
